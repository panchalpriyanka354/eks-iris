version: 0.2

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - aws --version
      - export AWS_DEFAULT_REGION=us-east-1
      - echo "AWS region set to $AWS_DEFAULT_REGION"
      - export REPOSITORY_URI=863518422262.dkr.ecr.us-east-1.amazonaws.com/ecr-iris-repo
      - echo "Logging in to ECR..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin 863518422262.dkr.ecr.us-east-1.amazonaws.com

  build:
    commands:
      - echo "Building the Docker image..."
      - docker build -t ml-iris-app .
      - echo "Docker image created successfully"
      - echo "Tagging the Docker image..."
      - docker tag ml-iris-app $REPOSITORY_URI:latest

  post_build:
    commands:
      - echo "Build completed on `date`"
      - echo "Pushing the Docker image to Amazon ECR..."
      - docker push $REPOSITORY_URI:latest
      - echo "Docker image successfully pushed to ECR"
      - echo "Deploying the Docker image to Elastic Kubernetes Service (EKS)..."

artifacts:
  files:
    - '**/*'
