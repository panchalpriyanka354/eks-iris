apiVersion: apps/v1
kind: Deployment
metadata:
  name: iris-codedeploy
  labels:
    app: iris-codedeploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: iris-codedeploy
  template:
    metadata:
      labels:
        app: iris-codedeploy
    spec:
      containers:
      - name: iris-codedeploy-container
        image: 863518422262.dkr.ecr.us-east-1.amazonaws.com/ecr-iris-repo
        ports:
        - containerPort: 80
