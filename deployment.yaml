apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app555
  labels:
    app: my-app555
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app555
  template:
    metadata:
      labels:
        app: my-app555
    spec:
      containers:
      - name: my-app555-container
        image: 863518422262.dkr.ecr.us-east-1.amazonaws.com/ecr-iris-repo
        ports:
        - containerPort: 80
